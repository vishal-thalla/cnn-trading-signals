[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-trading-signals"
version = "0.1.0"
description = "Turn OHLC bars into technical-indicator images, label turning points, and evaluate a CNN against baselines with purged walk-forward validation and a cost-aware backtest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishal Thalla" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cnn = ["torch>=2.2"]
data = ["yfinance>=0.2.50"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cts = "cnn_trading_signals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
